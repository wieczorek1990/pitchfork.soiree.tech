<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pitchfork.</title>

    <link href="css/bootstrap.css" rel="stylesheet">
    <link href='css/raleway.css' rel='stylesheet' type='text/css'>
    <link href="css/app.css" rel="stylesheet">

    <link rel="shortcut icon" href="/img/favicon.ico" type="image/x-icon" />

    <!-- HTML5 shim and Respond.js for IE8 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 9]>
    <script src="js/html5shiv.js"></script>
    <script src="js/respond.js"></script>
    <![endif]-->
</head>
<body>
<div id="start-overlay" class="start-overlay">
    <div class="start-content">
        <button id="start-button" class="btn btn-primary btn-lg">Start</button>
    </div>
</div>

<div id="game-content" class="container game-hidden">
    <div class="row">
        <div class="col-lg6">

            <div class="tones">
                <div class="tone">
                    <div id="first">
                        <div class="text-large">←</div>
                    </div>
                </div>
                <div class="tone">
                    <div id="second">
                        <div class="text-large">→</div>
                    </div>
                </div>
            </div>

            <div class="switches clear">
                <div class="switch">
                    <div id="lower">
                        <div class="text-small">↓</div>
                    </div>
                </div>
                <div class="switch">
                    <div id="equal">
                        <div class="text-small">=</div>
                    </div>
                </div>
                <div class="switch">
                    <div id="higher">
                        <div class="text-small">↑</div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<div id="correct-interstitial" class="interstitial">
    <div class="interstitial-content">
        <div class="interstitial-icon">✓</div>
    </div>
</div>

<div id="failure-interstitial" class="interstitial">
    <div class="interstitial-content">
        <div class="interstitial-icon">✗</div>
    </div>
</div>

<script src="js/jquery.js"></script>
<script src="js/bootstrap.js"></script>
<script src="js/mousetrap.js"></script>
<script src="js/app.js"></script>
</body>
</html>
